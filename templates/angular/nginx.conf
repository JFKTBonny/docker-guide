server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Send all routes to index.html so client-side routing works on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
